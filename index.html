<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+NZ+Basic:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Todo List</title>
  </head>
  <body>
    <h1>Todo List</h1>
    <label>Opis zadania</label>
    <textarea
      type="text"
      placeholder="Opis zadania..."
      id="taskDescriptionInput"
    ></textarea>
    <label>Deadline</label>
    <input type="date" id="dateInput" />
    <button style="margin-top: 20px" id="addTaskButton">Dodaj zadanie</button>
    <div class="to-do-list-container" id="taskList"></div>

    <div id="loadingOverlay" class="loading-overlay hide">
      <div class="spinner"></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
